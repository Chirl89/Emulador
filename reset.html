<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Actualizando Emulador NDS...</title>
  <style>
    body {
      background-color: #090a0f;
      color: #f0f3ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 240, 255, 0.2);
      border-top: 4px solid #00f0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    p {
      font-size: 14px;
      color: #8e99b7;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>🔄 Purgando caché de Apple Safari...</h2>
  <p>Eliminando registros antiguos y actualizando a la versión <strong>v0.1.9</strong>...</p>

  <script>
    async function purgeAndRedirect() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }
      } catch (err) {
        console.error('Error purgando:', err);
      } finally {
        setTimeout(() => {
          window.location.replace('./index.html?v=' + Date.now());
        }, 600);
      }
    }
    purgeAndRedirect();
  </script>
</body>
</html>
